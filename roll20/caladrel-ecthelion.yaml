  - _id: -NFu7upQEqRHleUNh0WH
    name: Bandolier
    notes: "Home >Equipment >Goods and Services >\nClothing & Containers\n\nThis page includes clothing and outfits as well as containers such as bags, pouches, boxes, chests and similar items.\n\nClothing and Outfits | Bags, Boxes and Pouches | Magic Containers\n\nClothing, Outfits & Accessories\n\nThis section includes clothes and outfits which can be useful for special occasions, such as braving an arctic wasteland, attending a gala, sleuthing around an urban setting, or any other situation where specific garb might be beneficial or fitting.\n\nA character may begin play with one outfit valued at 10 gp or less at no cost. Additional outfits or articles of clothing must be purchased normally.\n\nOutfits\nItem\tPrice\tWeight\tSource\nChausses\t1 gp\t3 lbs.*\tPPZO94102\nCorset\t1 sp–200 gp\t3 lbs.*\tPPZO94102\nDancer’s Garb\t100 gp\t5 lbs.\tPPZO94102\nDancer’s Garb, Silver\t200 gp\t5 lbs.\tPPZO94102\nGambeson\t1 gp\t4 lbs.*\tPPZO94102\nOutfit, Artisan’s\t1 gp\t4 lbs.1\tPZO1110\nOutfit, Burglar’s\t\
      5 gp\t5 lbs.*\tPPZO94102\nOutfit, Cold-Weather\t8 gp\t7 lbs.1\tPZO1110\nOutfit, cold-weather (animal companion)\t15 gp\t6 lbs.\tPZO1140\nOutfit, Courtesan’s\t8 gp\t4 lbs.*\tPPZO94102\nOutfit, Courtier’s\t30 gp\t6 lbs.1\tPZO1110\nOutfit, Dilettante’s\t20 gp\t8 lbs.\tPZO1121\nOutfit, Doctor’s\t150 gp\t6 lbs.\tPZO9410\nOutfit, Entertainer’s\t3 gp\t4 lbs.1\tPZO1110\nOutfit, Executioner’s\t5 gp\t8 lbs.*\tPPZO94102\nOutfit, Explorer’s\t10 gp\t8 lbs.1\tPZO1110\nOutfit, Flame-Retardant\t50 gp\t10 lbs.\tPZO1140\nOutfit, Hot Weather\t8 gp\t4 lbs.\tPZO1115\nOutfit, Monk’s\t5 gp\t2 lbs.1\tPZO1110\nOutfit, Noble’s\t75 gp\t10 lbs.1\tPZO1110\nOutfit, Peasant’s\t1 sp\t2 lbs.1\tPZO1110\nOutfit, Pickpocket’s\t5 gp\t3 lbs.1\tPZO9410\nOutfit, Royal\t200 gp\t15 lbs.1\tPZO1110\nOutfit, Scholar’s\t5 gp\t6 lbs.1\tPZO1110\nOutfit, Squire’s\t5 gp\t8 lbs.*\tPPZO94102\nOutfit, Sun Sensitivity\t300 gp\t5 lbs.\tPRG:TWoVHD\nOutfit, Traveler’s\t1 gp\t5 lbs.1\tPZO1110\nShinobi shozoku\t50 gp\t2 lbs.*\tPPZO94102\n\
      Silk kimono\t200 gp\t5 lbs.*\tPPZO94102\nSoldier’s uniform\t1 gp\t5 lbs.\tPZO1123\nSparring gear\t35 sp\t15 lbs.*\tPPZO94102\nSuit, diving\t10 gp\t2 lbs.\tPZO1123\nSwarmsuit\t20 gp\t10 lbs.\tPZO1110\nTear-Away Clothing\t+5 gp\tvaries1\tPZO9410\nFootwear\nItem\tPrice\tWeight\tSource\nBoots, stiletto\t10 gp\t1 lb.*\tPPZO94102\nBoots, fire-resistant\t20 gp\t2 lbs.\tPZO1123\nBoots, softpaw\t25 gp\t1 lb.\tPZO1121\nCleats\t5 gp\t2 lbs.\tPZO1115\nCushion inserts\t5 sp\t—\tPZO1140\nSkates, ice\t1 gp\t2 lbs.\tPZO1123\nSkis\t5 gp\t20 lbs.\tPZO1123\nSnowshoes\t5 gp\t4 lbs.1\tPZO1115\nFace, Head and Neck\nItem\tPrice\tWeight\tSource\nCape, Billow\t100 gp\t4 lbs.\tPZO1121\nEyeglasses\t5 gp\t—\tPZO9410\nEye patch\t1 sp\t—\tPoIS\nGoggles, Gloom Sight\t200 gp\t—\tPZO1121\nGoggles, Smoked\t10 gp\t—\tPZO1115\nHat\t1 sp to 50 gp\t1/2 to 2 lbs.\tPZO9410\nMask\t1 sp to 50 gp\t1 lb.1\tPZO9410\nMask, Battle\t50 gp\t2 lbs.\tPZO1121\nMask, Doctor’s\t50 gp\t2 lbs.\tPZO9410\nMask, Monster\t5–10 gp\t1 lb.\tPZO1123\n\
      Neck Guard\t10 gp\t1/4 lb.\tPZO1121\nScarf\t1 sp to 5 gp\t1/2 lb.1\tPZO9410\nScarf, filter\t5 gp\t—\tPZO1140\nScarf, head\t1 sp–10 gp\t—\tPPZO94102\nScarf, pocketed\t8 gp\t1/2 lbs.1\tPZO9410\nScarf, reinforced\t10 gp\t1 lb.1\tPZO9410\nWig\t5 gp to 500 gp\t1/2 to 4 lbs.1\tPZO9410\nBodywear\nItem\tPrice\tWeight\tSource\nCloak, Patchwork\t5 gp\t1/2 lb.\tPZO1123\nCloak, Reversible\t2 sp–100 gp\t1 lb.\tPZO1123\nCloak, Wing\t1,200 gp\t1 lb.\tPZO1121\nFurs\t12 gp\t5 lbs.1\tPZO1115\nKilt\t2 sp\t1 lb.\tPZO1123\nPoncho\t5 sp\t2 lbs.\tPZO1123\nSash, Adventurer’s\t20 gp\t3 lbs. (container)\tSOS\nSpeed sheath\t10 gp\t1 lb.\tPZO1140\nTabard\t5 gp\t1 lb.\tPZO1123\nVest\t1 sp to 50 gp\t1/2 lb.1\tPZO9410\nVest, barbed\t10 gp\t4 lbs.\tPZO1110\nVestments, Cleric’s\t5 gp\t6 lbs.1\tPZO1110\nJewelry, Perfumes and other Decorative Accessories\nItem\tPrice\tWeight\tSource\nBrooch\tVaries\t—\tPZO1123\nCaul\t10–100 gp\t—\tPZO1123\nDecorative trim\t1 sp–50 gp\t—\tPZO1123\nHennin\t10–100 gp\t1 lb.\tPZO1123\n\
      Jewelry\tvaries\tvaries\tPZO9410\nJewelry, false\t+20 gp\t—\tRotRLPG\nLocket, Poisoned\t75 gp\t—\tPPC:P&P\nPerfume/Cologne, common\t1 gp/dose\t—\tISWG\nPerfume/Cologne, exotic\t100 gp/dose\t—\tISWG\nPerfume/Cologne, common (1 dose)\t1 gp\t—\tPCS\nPerfume/Cologne, rare (1 dose)\t10 gp\t—\tPCS\nPerfume/Cologne, exotic (1 dose)\t100 gp\t—\tPCS\nRing, poison pill\t+20 gp\t—\tPZO9410\nRing, signet\t5 gp\t—\tPZO1110\nWatch, pocket\t250 gp\t1 lb\tPZO9410\nTattoo\t1 cp – 20gp\t—\tPZO9410\nOutfits\nAll characters begin play with one outfit, valued at 10 gp or less. Additional outfits can be purchased normally.\n\nOutfit, Artisan’s\nSource PZO1110\n\nThis outfit includes a shirt with buttons, a skirt or pants with a drawstring, shoes, and perhaps a cap or hat. It may also include a belt or a leather or cloth apron for carrying tools.\n\nOutfit, Burglar’s\nSource PPZO94102\n\nPrice 5 gp; Weight 5 lbs.\n\nThis outfit consists of fitted pants, a shirt, a hooded reversible cloak, soft leather boots,\
      \ and a face mask, all in dark or neutral colors. The outfit’s few buttons and rivets are wrapped in dull, dark cloth to avoid jingling or reflecting light. A number of loops and shallow pockets are also worked into the outfit, providing ample spaces for stashing small tools or weapons.\n\nOutfit, Companion Cold-Weather\nPrice 15 gp; Weight 6 lbs.\n\nThis vestment works just like a cold-weather outfit, granting a +5 circumstance bonus on Fortitude saving throws against exposure to cold weather, except it is custom made for an animal companion. The added cost represents custom tailoring to ensure that the furs used don’t cause unwanted reactions from the animal wearing the outfit.\n\nOutfit, Flame-Retardant\nPrice 50 gp; Weight 10 lbs.\n\nConstructed to resist the effects of hot environments (such as forest fires and areas of volcanic activity), this set of overlapping, heavy leather clothing includes a pair of fire-resistant boots. The outfit grants fire resistance 1, but exposure\
      \ to fire damage ruins the outfit after 20 rounds.\n\nOutfit, Courtesan’s\nSource PPZO94102\n\nPrice 8 gp; Weight 4 lbs.\n\nThis outfit includes fine silk or satin garments tailored to complement your figure. In addition, the outfit contains a loose shawl or robe with several discreet pockets for items such as perfume, massage oils, or even a small dagger.\n\nOutfit, Cold-Weather\nSource PZO1110\n\nThis outfit includes a wool coat, linen shirt, wool cap, heavy cloak, thick pants or skirt, and boots. This outfit grants a +5 circumstance bonus on Fortitude saving throws against exposure to cold weather.\n\nOutfit, Courtier’s\nSource PZO1110\n\nThis outfit includes fancy, tailored clothes in whatever fashion happens to be the current style in the courts of the nobles. Anyone trying to influence nobles or courtiers while wearing street dress will have a hard time of it (–2 penalty on Charisma-based skill checks to influence such individuals). If you wear this outfit without jewelry (costing\
      \ an additional 50 gp), you look like an out-of-place commoner.\n\nAs this outfit does not cost 10 gp or less, player characters can not choose this outfit for free when first beginning play.\n\nOutfit, Dilettante’s\nSource PZO1121\n\nThese clothes are favored by gnome inventors and wanderers, and consist of sturdy boots, a pair of stout linen pants or skirt, a cloth shirt, leather gloves, a hat and cloak, and numerous belts, straps, and accessories (such as scarves, a vest, bits of rope or twine, and bandoleers). These items are generally mismatched, each having been selected as “superior” from some other set of clothing, and are rife with pockets and small hidey-holes. It the wearer a +2 circumstance bonus on Sleight of Hand checks made to conceal a small object on her body.\n\nAs this outfit does not cost 10 gp or less, player characters can not choose this outfit for free when first beginning play.\n\nOutfit, Doctor’s\nSource PZO9410\n\nAny creature wearing this outfit gains a\
      \ +2 circumstance bonus on Fortitude saves made to resist contact diseases.\n\nAs this outfit does not cost 10 gp or less, player characters can not choose this outfit for free when first beginning play.\n\nOutfit, Entertainer’s\nSource PZO1110\n\nThis set of flashy—perhaps even gaudy—clothes is for entertaining. While the outfit looks whimsical, its practical design lets you tumble, dance, walk a tightrope, or just run (if the audience turns ugly).\n\nOutfit, Executioner’s\nSource PPZO94102\n\nPrice 5 gp; Weight 8 lbs.\n\nTypically worn by jailers or executioners, this outfit includes a black woolen shirt, a tunic, pants, a belt, sturdy boots, a balaclava or hood, and a great cloak. This outfit is generally too intimidating and macabre to be worn in polite company.\n\nSome executioner’s outfits prominently bear the symbol of the government or law-enforcing institution the wearer serves, while others are left ragged and stained to appear all the more threatening.\n\nOutfit, Explorer’s\n\
      Source PZO1110\n\nThis set of clothes is for someone who never knows what to expect. It includes sturdy boots, leather breeches or a skirt, a belt, a shirt (perhaps with a vest or jacket), gloves, and a cloak. Rather than a leather skirt, a leather overtunic may be worn over a cloth skirt. The clothes have plenty of pockets (especially the cloak). The outfit also includes any extra accessories you might need, such as a scarf or a wide-brimmed hat.\n\nOutfit, Hot Weather\nSource PZO1115\n\nCovering your body from head to foot in light, airy cloth keeps you cooler than baring your skin to the sun. This outfit typically consists of a loose linen robe and either a turban or loose head covering and veil. The outfit provides a +2 bonus on Fortitude saves to resist warm or hot weather. This does not stack with any bonuses gained from the Survival skill.\n\nOutfit, Monk’s\nSource PZO1110\n\nThis simple outfit includes sandals, loose breeches, and a loose shirt, and is bound together with sashes.\
      \ The outfit is designed to give you maximum mobility, and it’s made of high-quality fabric. You can conceal small weapons in pockets hidden in the folds, and the sashes are strong enough to serve as short ropes.\n\nOutfit, Noble’s\nSource PZO1110\n\nThese clothes are designed specifically to be expensive and gaudy. Precious metals and gems are worked into the clothing. A would-be noble also needs a signet ring and jewelry (worth at least 100 gp) to accessorize this outfit.\n\nAs this outfit does not cost 10 gp or less, player characters can not choose this outfit for free when first beginning play.\n\nOutfit, Peasant’s\nSource PZO1110\n\nThis set of clothes consists of a loose shirt and baggy breeches, or a loose shirt and skirt or overdress. Cloth wrappings are used for shoes.\n\nOutfit, Pickpocket’s\nSource PZO9410\n\nOutfitted with concealed pockets, this clothing gives you a +2 bonus on hiding small objects on your person.\n\nOutfit, Royal\nSource PZO1110\n\nThis is just the clothing,\
      \ not the royal scepter, crown, ring, and other accoutrements. Royal clothes are ostentatious, with gems, gold, silk, and fur in abundance.\n\nAs this outfit does not cost 10 gp or less, player characters can not choose this outfit for free when first beginning play.\n\nOutfit, Scholar’s\nSource PZO1110\n\nPerfect for a scholar, this outfit includes a robe, a belt, a cap, soft shoes, and possibly a cloak.\n\nOutfit, Squire’s\nSource PPZO94102\n\nPrice 5 gp; Weight 8 lbs.\n\nThis outfit includes heavy woolen pants, a tunic, leather boots, a belt, sturdy gloves, a cap, and a heavy tabard bearing the colors or sigil of a noble house or organization. Many organizations provide new squires this outfit for free, with the expectation they wear it during their duties.\n\nOutfit, Sun Sensitivity\nSource PRG:TWoVHD\n\nPrice 300 gp; Weight 5 lbs.\n\nDhampirs and other races sensitive to glaring light know a unique hell when traveling under the sun’s vicious rays. To protect against the painful\
      \ light, members of these races often shield themselves with some combination of heavy cloaks, gloves, tinted glasses, screening salves, and—most importantly—wide-brimmed hats. A sun sensitivity outfit prevents creatures with light sensitivity from being dazzled when walking, traveling, or otherwise performing simple acts in areas of bright natural light. Acclimating to the light still requires a moment of adjustment, so even when wearing this outfit, creatures with light sensitivity are dazzled for 1 minute after entering an area of bright sunlight. Violent activity such as combat (or any other act that might jostle the wearer’s hat) also counters the outfit’s effectiveness, causing the wearer to be subject to light sensitivity as normal. A sun sensitivity outfit offers no protection against magical light, such as the spell daylight.\n\nOutfit, Traveler’s\nSource PZO1110\n\nThis set of clothes consists of boots, a wool skirt or breeches, a sturdy belt, a shirt (perhaps with a vest\
      \ or jacket), and an ample cloak with a hood.\n\nFootwear\nBoots\nType\tPrice\tWeight\tSource\nFire-resistant\t2 gp\t2 lbs.\tPZO1123\nSoftpaw\t50 gp\t4 lbs.\tPZO1121\nStiletto\t5 gp\t1 lbs.\tPPZO94102\nWading\t50 gp\t2 lbs.\tPZO1140\nBoots, Fire-Resistant These heavy leather boots contain a layer of brick dust that protects your feet from heat. You gain fire resistance 2 against fire attacks directed at or under your feet, such as walking across hot coals. Repeat or prolonged exposure to fire damage eventually burns the outer leather of the boots, ruining them (typically after about 1d10+20 rounds of exposure).\n\nBoots, Softpaw These soft and subtle boots are constructed of silk and specially cured leather. They are specially designed for catfolk feet. They work with the feline structure of the race’s feet to soften footfalls and to reduce the imprints of their tracks. While wearing softpaw boots, a catfolk gains a +1 circumstance bonus on Stealth checks. Furthermore, the DC to notice\
      \ or follow the tracks of a catfolk wearing softpaw boots increases by +2. Source PZO1121\n\nBoots, Stiletto The most ostentatious and impractical of footwear, the tall heel attached to these boots adds several inches to your height. This type of boot is popular among nobles, though the trend has recently caught on among some members of noble courts. You can use the heel of a stiletto boot as an improvised weapon, dealing damage as a punching dagger. Source PPZO94102\n\nBoots, Wading These waterproof boots are felt lined and have a thin layer of metal around the soles. The top of each boot ends just before the knee, with a cord for tying the top shut over clothing or exposed skin. These boots assist in prolonged hikes through deep mud or shallow pools, granting the wearer a +1 circumstance bonus on Profession (fisher) checks while fishing in shallow water. Source PZO1140\n\nCleats\nSource PZO1115\n\nUseful on any terrain where traction may be a concern, cleats are shoes with spikes\
      \ or hooks attached to the soles. Cleats reduce the penalty for walking over slick surfaces by 50%; for example, walking across ice normally costs 2 squares for every square of movement, but with cleats it costs only 1.5 squares for every square. Cleats cause damage to any type of finished flooring.\n\nCushioned Inserts\nPrice 5 SP; Weight —\n\nThese rubber boot or shoe inserts cushion your feet and improve your gait, granting you a +1 circumstance bonus on Constitution checks to continue running and to avoid nonlethal damage from a forced march.\n\nSkates, Ice\nPrice 1 gp; Weight 2 lbs.\n\nEach of these calf-high boots bears a vertical blade on the bottom, allowing you to travel swiftly on ice. Wearing ice skates allows you to move on ice at normal speed with a successful DC 5 Acrobatics check (including running and charging), but your movement is reduced to half speed on all other terrain. Donning or removing an ice skate is a full-round action. Skating with only one is possible,\
      \ but the DC of the Acrobatics check rises to 15.\n\nSkis\nPrice 5 gp; Weight 20 lb.\n\nEach ski is a flat piece of wood about 5–6 feet long for a Medium wearer, curled up slightly at the front end, with lengthwise grooves along the underside and a wooden or metal bracket with laces on top for holding the wearer’s boot in place. Wearing skis allows you to move on snow and ice at normal speed, but your movement is reduced to 5 feet on all other terrain. You normally use a pair of spiked poles to help you move and maintain balance while skiing, but javelins, shortspears, or even trimmed-down saplings will do if nothing else more suitable is available. Donning or removing a ski is a full-round action, though the laces can be cut as a move action (which requires repairing or replacing the laces if you want to use the skis again).\n\nSnowshoes\nSource PZO1115\n\nThese high-tension nets of rope or sinew in wooden frames which are lashed to the feet spread your weight across the snow, making\
      \ you much less likely to break through the crust and rendering walking much easier. Snowshoes reduce the penalty for walking through heavy snow by 50%; for example, if moving through snow normally costs you 2 squares of movement per square traveled, snowshoes reduce this cost to 1.5 squares per square traveled.\n\nFace, Head and Neck\nCape, Billow\nSource PZO1121\n\nThis silk cape is constructed of many carefully arranged overlapping layers that are loosely stitched together. When exposed to a sudden influx of air, like that caused by falling, the cloak unfolds like a crude parachute. When falling, a creature wearing a billow cape is treated as if he had deliberately jumped from the height. When worn in areas of strong wind or greater, a billow cape hampers movement. In such wind conditions, the wearer treats all terrain as difficult terrain and takes a –4 penalty on Fly checks. Because of the strange and somewhat fragile construction of this cape, only Small or smaller billow capes\
      \ function properly. Larger billow capes take all the penalties resulting from high winds, but grant none of the benefits when the wearer falls.\n\nEyeglasses\nSource PZO9410\n\nAlso known as spectacles, eyeglasses compensate for poor vision or magnify small details.\n\nEye Patch\nSource PPC:PotIS.\n\nAn eye patch covers one eye and ties around the head. Pirates usually wear eye patches to cover injured or blind eyes, but some wear eye patches to look more intimidating, or to keep one eye covered and thus retain their night vision when transitioning from the relative darkness belowdecks to the sunlight above.\n\nGoggles, Gloom Sight\nSource PZO1121\n\nThese non-magical goggles are set with a piece of alchemically treated, black, obsidian-like stone found in the mountainous regions of the Shadow Plane. Gloom sight goggles interact with the unique eyes of fetchlings in such a way that when the goggles are worn over both eyes, they expand the range of a fetchling’s darkvision to 90 feet,\
      \ but the fetchling also gains the light sensitivity weakness. Other races cannot see through the lenses of these goggles, and they have no affect on fetchlings whose eyes have been modified by the Gloom Sight feat. Though they are alchemical rather than magical in nature, these goggles take up the magic item eye slot.\n\nGoggles, Smoked\nSource PZO1115\n\nThese spectacles have lenses made of smoked glass that help protect against creatures with gaze attacks. You are always treated as averting your gaze when dealing with gaze attacks, and you gain a +8 circumstance bonus on saving throws against visual-based attacks (any attack that a blind creature would be immune to). You have a –4 penalty on Perception checks while wearing the goggles, and all opponents are treated as having concealment (20% miss chance).\n\nHat\nSource PZO9410, PPC:PotIS.\n\nHats of various styles appear in all cultures. Ranging from the turban to the headscarf to the tricorn to the furred cap, a hat can be a simple\
      \ covering for the head or a sign of rank and status. Particular hats are sometimes mandatory for social or religious sects. Pirates often wear bandanas or tricorn hats, while captains prefer bicornes and may wear them either “fore-and-aft” (with the points in front of and behind them) or “athwart” (sideways.)\n\nMask\nSource PZO9410\n\nGala events are where one may see the most outlandish and stylish of masks, but simpler masks may be found wherever local customs permit. They range from small bits of fabric that cover only a portion of the face to elaborate constructions that cover the entire face or head.\n\nMask, Battle\nSource PZO1121\n\nMade from wood, bone, or similar materials, this mask covers its wearer’s actual appearance and identity by depicting a hateful, leering face instead. Because of a battle mask’s excellent craftsmanship and exquisite details, the wearer gains a +1 bonus on Intimidate checks made to demoralize an opponent.\n\nMask, Doctor’s\nSource PZO9410\n\nThis\
      \ mask gives you a +1 circumstance bonus on Fortitude saves made against airborne toxins and scent-based effects. It is sometimes a crime to wear a doctor’s mask in public if you are not a healer or physician.\n\nMask, Monster\nPrice varies; Weight 1 lb.\n\nThis articulated mask resembles a specific type of humanoid monster, such as a bugbear, goblin, orc, or hobgoblin. The mouth opens and closes when you move your jaw and its skin is actually carefully-painted cloth. Though such masks are usually intended for theater performances where an actor plays the role of a monster, adventurers have been known to use them to help blend in with monsters of the appropriate type. The mask negates the –2 Disguise DC for disguising yourself as a different race, but only at a distance of at least 20 feet or when you have concealment; closer than this distance or in clearer circumstances, the mask is obviously a false representation. It only covers your face and is normally worn with a wig or helmet\
      \ to disguise or cover the rest of your head. Each mask is most suitable for a wearer of a particular size, though some size and monster combinations are less believable than others (a Small creature in an orc mask may be able to pass as an orc child, but a Medium creature in a goblin mask at best looks like a deformed hobgoblin).\n\nNeck Guard\nSource PZO1121\n\nMade from hardened leather reinforced with a band of metal, this collar protects the wearer against vampire bites when worn around the throat. It provides a +1 armor bonus to AC against vampire bites or similar attacks that specifically target the wearer’s throat. Unlike most armor bonuses, the neck guard’s +1 bonus stacks with the armor bonus of light or medium armor, but it provides no additional bonus when worn with heavy armor.\n\nScarf\nSource PZO9410\n\nScarves of colorful cloth or transparent silk, often embroidered with elaborate scenes, are favorite accessories.\n\nScarf, Filter\nPrice 5 gp; Weight —\n\nMade of heavy\
      \ material, this scarf filters out dust, sand, smoke, and other airborne contaminants. When worn over your nose and mouth, this scarf grants you a +1 resistance bonus on saving throws against inhaled poisons and other airborne effects that require breathing.\n\nScarf, Head\nSource PPZO94102\n\nPrice 1 sp–10 gp; Weight —\n\nOften worn for privacy, religious or cultural reasons, or protection from the elements, full scarves designed to be wrapped around the head are common accessories. Headscarves of bright colors or ornate embroidery can fetch a substantially higher price.\n\nScarf, Pocketed\nSource PZO9410\n\nAn elaborate design disguises several small pockets on one side of this scarf. This scarf grants you a +4 bonus on Sleight of Hand checks made to hide objects on your body. This bonus does not stack with the bonus wearing heavy clothing provides but does stack with bonuses for attempting to hide small objects.\n\nScarf, Reinforced\nSource PZO9410\n\nOne side of this 8-foot-long\
      \ scarf is reinforced with chain links and metal plates. While not enough to provide a benefit to Armor Class, these versatile scarves can be used like a length of chain to climb short distances or bind an enemy. A reinforced scarf has hardness 10 and 4 hit points. It can be burst with a DC 24 Strength check.\n\nWig\nSource PZO9410\n\nFalse hair comes in many forms, from the severe coif of a judge to the towering confection adorning a noble to the simple curls worn by a housewife whose hair is thinning. Wigs can be found for sale in any major city and can be special-ordered in most towns. As they are usually made of hair, the available colors are likely limited by the locally predominant hair color, but others can be obtained by applying dye.\n\nBodywear\nChausses\nSource PPZO94102\n\nPrice 1 gp; Weight 3 lbs.\n\nThese padded woolen leggings are quilted to provide extra warmth and protection. They are frequently worn under mail or plate armor.\n\nCloak, Patchwork\nPrice 5 gp; Weight\
      \ 1/2 lb.\n\nThese cloaks are popular among traveling bards, and each patchwork cloak is unique. The patches represent where the traveler has been, and often the performer uses them to recall specific stories from his repertoire. When a bard retires or dies, he often bequeaths his cloak to a young entertainer he mentored or admired.\n\nCloak, Reversible\nPrice varies; Weight 1 lb.\n\nThis cloak has an outer layer of fabric and an inner layer of a different color. They are worn for the sake of fashion, in theater performances, or to aid a quick appearance change as part of a disguise. The price varies depending on the cloak’s quality, with the low end being a simple linen cloak and the high end being made of silk or decorated with fur trim.\n\nCloak, Wing\nSource PZO1121\n\nThis strange piece of equipment only works for sylphs and similar creatures, whose light, airy bodies can be borne upon the winds. Looking like a fine silk traveler’s cloak, a wing cloak is secretly reinforced with\
      \ a series of wooden struts that, when locked into place, stretch the cloak’s fabric into a rudimentary wing. Arranging the struts into a wing or reversing the change is a move action. When the cloak is shaped into a wing, the wearer can make a DC 15 Fly check to fall safely from any height without taking falling damage, as if using feather fall. When falling, the wearer may make an additional DC 15 Fly check to glide, moving 5 feet laterally for every 20 feet she falls. Readying and using a wing cloak requires two hands and provokes an attack of opportunity. A wing cloak has hardness 0 and 5 hit points. If the wing cloak is broken, the Fly DCs to use it increase by +10.\n\nCorset\nSource PPZO94102\n\nPrice 1 SP–200 gp; Weight 3 lbs.\n\nSewn-in boning and laces allow this bodice to adjust your waist size in a way considered alluring by some cultures. The restrictive nature of this garment makes it a poor choice for combat or other athletic exertions, but you can easily conceal a thin\
      \ knife in the corset’s boning. The price varies greatly depending on the corset’s quality; the cheapest corsets are made of simple cloth and cost mere silver pieces, while the most expensive feature silk brocade and are decorated with pearls or other costly adornments.\n\nDancer’s Garb\nSource PPZO94102\n\nPrice 100 gp; Weight 5 lbs.\n\nThis combination of loose-fitting sashes, veils, and ornamentation accentuates a dancer’s form and movements.\n\nDancer’s garb provides a +2 circumstance bonus on Perform (dance) checks, similar to that provided by masterwork instruments for other Perform skills, but does not grant this benefit when worn with armor or other concealing clothing.\n\nDancer’s Garb, Silver\nSource PPZO94102\n\nPrice 200 gp; Weight 5 lbs.\n\nIn addition to granting the same bonus on Perform (dance) checks as regular dancer’s garb, silver dancer’s garb is considered a silver instrument for silver balladeer bards.\n\nSilver dancer’s garb can be made of sunsilver (see below);\
      \ sunsilver dancer’s garb costs an additional 3,000 gp and grants the same benefits as armor made of sunsilver. As with the bonus on Perform (dance) checks, this benefit functions only when no other armor or concealing clothing is worn.\n\nDiving Suit\nPrice 10 gp; Weight 2 lbs.\n\nThis one-piece suit of clothing reduces one’s drag in the water, making swimming easier. It provides a +1 circumstance bonus on Swim checks. The suit only grants this bonus if it is the outermost garment, and has no effect if worn over bulky clothes or armor or with cumbersome gear (such as a backpack, large weapons, and so on). Damage to the suit (such as from several rounds of combat against slashing and piercing attacks) negates the suit’s bonus until it is repaired.\n\nFurs\nSource PZO1115\n\nThe most basic of cold-weather gear, animal furs serve to keep their wearers warm. Wearing enough fur to cover the body provides a +2 bonus on Fortitude saves to resist cold weather. This does not stack with any\
      \ bonuses gained from the Survival skill.\n\nGambeson\nSource PPZO94102\n\nPrice 1 gp; Weight 4 lbs.\n\nThis padded cloth jacket is often worn alone or with mail or plate armor and is favored by hunters, guards, and soldiers. A gambeson fitted with leather loops to more easily attach armor is called an arming doublet. Although sufficient to protect you against casual scrapes, it is not as thick as padded armor.\n\nKilt\nPrice 2 sp; Weight 1 lb.\n\nThis heavy pleated skirt is usually worn by men. Most have a specific design or pattern that represents allegiance to a particular clan or other social group.\n\nPoncho\nPrice 5 sp; Weight 2 lbs.\n\nThis circle of water-resistant fabric (typically wool or leather) has a hooded opening in the center, making it easy to slip it on or off and protecting your entire body from rain or snow.\n\nSash, Adventurer’s\nSource PPZO94102\n\nPrice 20 gp; Weight 3 lbs.\n\nThis bandolier holds six pouches along its length and a satchel at the hip. Each pouch\
      \ has a stiff leather flap that can be secured against jostling with a clasp (requiring a move action to open or close) or left unfastened for easier access. The pouches and satchel contain loops and ties for securing additional equipment.\n\nThe sash buckles at the shoulder, and in an emergency can be freed with a sharp tug as a move action.\n\nSoldier’s Uniform\nPrice 1 gp; Weight 5 lbs.\n\nThe exact details of this item varies from country to country, but typically includes sturdy boots, leather breeches or a kilt, a belt, a shirt, gloves, a cloak or jacket, and a hat. The belt includes several loops or rings for tying pouches, a waterskin, a scabbard, and similar things a traveling soldier requires.\n\nSparring Gear\nSource PPZO94102\n\nPrice 35 sp; Weight 15 lb.\n\nThis array of thick, heavily lined pads, including a quilted helmet, rigid shin guards, and a wraparound rib guard, protects you during hand-to-hand training. Sparring gear cannot be worn with armor, but grants DR 2/—\
      \ against nonlethal damage. Fighting schools often customize their sparring gear to feature prestigious colors or symbols.\n\nSwarmsuit\nSource PZO1115\n\nThese heavy and overlapping layers of clothing, coupled with a wide hat outfitted with a dense, veil-like netting around its brim makes it all but impossible for Diminutive and Fine creatures to make physical contact with your body. Wearing a swarmsuit cuts your speed in half, but gives you DR 10/— against swarms of Fine creatures and DR 5/— against swarms of Diminutive creatures.\n\nTear-Away Clothing\nSource PZO9410\n\nSneaks and thieves throughout Golarion know the value of a good disguise. The ability to remove that disguise in a hurry, thus revealing the next layer of disguise, is nearly as valuable. Tear-away clothing is generally loose fitting and long to allow another layer of clothing to be worn underneath. The seams and catches on this clothing are designed to break easily, making it a simple matter (a standard action)\
      \ to remove these items and walk away with none the wiser.\n\nTabard\nPrice 5 gp; Weight 1 lb.\n\nOften worn over armor, this outer garment is usually sleeveless and open at the sides. The broad front provides a canvas for insignias and coats of arms, making a wearer’s membership in an order readily apparent.\n\nVest\nSource PZO9410\n\nMuch like hats, vests appear in almost all cultures. Though the basic design remains the same, they vary wildly in cut, color, and function. The difference between court vests and dancing vests is quite striking.\n\nVest, Barbed\nSource PZO1115\n\nThin leather flaps keep the hundreds of tiny, fishhook-like needles dotting the surface of this black vest from harming you while you wear it. However, any creature that injures you with a natural or unarmed attack must make a DC 15 Reflex save or take 1 point of damage. Any creature swallows you it takes 1 point of damage each round until it either spits you up, you escape, or you die (at which point the vest\
      \ has sustained enough damage to no longer serve as a threat). The vest can only be worn over light armor or no armor.\n\nVestments, Cleric’s\nSource PZO1110\n\nThese clothes are for performing priestly functions, not for adventuring. Cleric’s vestments typically include a cassock, stole, and surplice.\n\nJewelry, Perfumes and other Decorative Accessories\nBrooch\nPrice varies; Weight —\n\nThis is a small ornament used to hold an element of clothing, such as a cloak or cape, in place. Many organizations provide special brooches as a symbol of membership or to honor a special achievement.\n\nCaul\nPrice varies; Weight —\n\nThis ornate hairnet, fashioned from silk, cloth of gold, and jewels, is most commonly worn by royal or aristocratic women.\n\nDecorative Trim\nPrice varies; Weight —\n\nThis decorative set of collars, cuffs, and trim pieces attaches to otherwise plain clothes. Frequent travelers, such as merchants or entertainers, use trim to blend in with the local styles without\
      \ buying a new wardrobe. A traveling noble keeps extra sets for use by temporary staff and loaned guards.\n\nHennin\nPrice varies; Weight 1 lb.\n\nThis high conical headpiece ends in a tip that usually has a piece of silk or similar diaphanous material dangling from it. Women of noble birth sometimes wear a hennin to formal or social occasions as a signal of their eligibility, and give the silk part of the headpiece as a token to suitors they favor.\n\nJewelry\nSource PZO9410\n\nThe cost of jewelry varies wildly by its quality. Many cultures consciously use jewelry as a form of portable wealth, most notably in belts and bangles made from coins. A commoner’s ornaments may only be worth a few copper pieces, a tradesman’s a few silver pieces, and a merchant’s a few gold pieces, while nobles rarely wear jewelry worth less than 100 gp.\n\nJewelry, False\nSource Rise of the Runelords Player’s Guide\n\nFavored by rogues, these adornments hide tiny secret compartments. False jewelry grants\
      \ a +8 bonus on Sleight of Hand checks to hide a tiny object on your person (does not stack with the bonus for hiding very small objects) and negates the +4 bonuses searchers receive when frisking you. False jewelry costs 20 gp in addition to the value of the ornament being fitted with the secret compartment.\n\nLocket, Poisoned\nSource PPC:P&P\n\nPrice 75 gp; Weight —\n\nThis heart-shaped locket is attached to a thin metal chain made of looped strands of gold or silver. Inside the locket is a small, spring-loaded vial that can hold a single dose of powdered poison. Loading the locket with poison carries the same risks as applying poison to a weapon. When the locket is opened, the vial is shattered by a ball bearing, releasing the powder into the air and treating the poison’s type as if it were inhaled. The airborne poison affects all creatures within 10 feet of the locket.\n\nPerfume or Cologne\nSource PZO9410\n\nPerfume and cologne are common accessories for those who hope to avoid\
      \ offending through scent. More expensive scents are available in finer quarters of any city. Exotic scents are sold in vials containing 10 applications, with a single dose lasting for 24 hours during which its wearer gains a +2 circumstance bonus on all Diplomacy checks (save for those against creatures who, at the GM’s discretion, would not be swayed by scent).\n\nRing, Poison pill\nSource PZO1115\n\nThis ring has a tiny compartment under the setting, typically used to hold poison. Opening and closing a ring is a move action; doing so unseen requires a DC 20 Sleight of Hand check.\n\nRing, Signet\nSource PZO1110\n\nA ring with a family symbol or crest on it. It is often pressed into hot wax on objects when they are sealed, leaving a family imprint.\n\nTattoo\nSource PZO1115\n\nThe cost of a tattoo depends on the quality, size, and number of colors used. A coin-sized tattoo in blue ink that will blur over a decade may cost 1 cp, a hand-sized one in black ink that won’t fade costs\
      \ 1 sp, and a tattoo covering an entire back takes several sessions and costs 10 gp. Each additional color costs as much as a single tattoo of its size.\n\n\nBags, Barrels, Boxes, Chests & Pouches\nAll containers are empty unless stated otherwise (price and weight are for container only.)\n\nBags and Pouches\nItem\tPrice\tWeight\tSource\nBackpack, common\t2 gp\t2 lbs.1\tPZO1123\nBackpack, masterwork\t50 gp\t4 lbs.1\tPZO1123\nBag, waterproof\t5 sp\t1/2 lb.\tPZO1123\nBandolier\t5 sp\t—\tPZO1123\nPocket, inside\t4 gp\t—\tPZO1140\nPouch, belt\t1 gp\t1/2 lb.1\tPZO1123\nPouch, spell components\t5 gp\t2 lbs.\tPZO1110\nPouch, waist\t5 sp\t1/2 lb.\tPZO1140\nPouch, war spirit\t50 gp\t—\tPZO1121\nSack\t1 sp\t1/2 lb.1\tPZO1110\nSatchel, familiar\t25 gp\t6 lbs.\tPZO1123\nWaterskin\t1 gp\t4 lbs.1\tPZO1110\nBarrels, Boxes, and Chests\nItem\tPrice\tWeight\tSource\nBarrel\t2 gp\t30 lbs.\tPZO1123\nBasket\t4 sp\t1 lb.\tPZO1123\nBottle\t2 gp\t1 lb.\tPZO1123\nBox, scroll\t5 gp\t1 lb.\tPZO1123\nBucket\t\
      5 sp\t2 lbs.\tPZO1123\nCanteen\t2 gp\t1 lb.\tPZO1123\nCase, scroll\t1 gp\t1/2 lb.\tPZO1123\nCauldron\t1 gp\t5 lbs.\tPZO1123\nCauldron, mithral\t2,501 gp\t2-1/2 lbs.\tPZO1123\nChest, Small / Small treasure chest\t2 gp / 3 gp\t25 lbs.\tPZO9410/PoIS\nChest, Medium / Medium treasure chest\t5 gp / 7 gp\t50 lbs.\tPZO1110/PoIS\nChest, Large / Large treasure chest\t10 gp / 15 gp\t100 lbs.\tPZO1110/PoIS\nChest, Huge / Huge treasure chest\t25 gp / 37 gp\t250 lbs.\tPZO1110/PoIS\nCooler\t25 gp\t60 lbs.\nChest, false bottomed\t52 gp\t25 lbs.\tPZO9410\nCoffee pot\t3 gp\t4 lbs.\tPZO1123\nCoffin, common\t10 gp\t30 lbs.1\tPZO1123\nCoffin, ornate\t100 gp\t50 lbs.1\tPZO1123\nCup\t1 gp\t—\tPZO9410\nCup, false bottomed\t1 gp\t—\tPZO1123\nFlask\t3 cp\t1-1/2 lbs.\tPZO1123\nFlask, hip\t1 gp\t1/2 lb.1\tPZO1123\nGoblet, poisoner’s\t100 gp\t2 lbs.\tPPC:P&P\nJug\t3 cp\t9 lbs.\tPZO1123\nMug/Tankard, clay\t2 cp\t1 lbs.\tPZO1110\nPitcher\t2 cp\t5 lbs.\tPZO1123\nPot, iron\t8 sp\t4 lbs.\tPZO1110\nPot, mithral\t2,001\
      \ gp\t2 lbs.\tPZO1123\nPotion Sponge\t2 gp\t—\tPZO1121\nVial (for ink or potions)\t1 gp\t—\tPZO1123\nVial, iron\t1 sp\t1 lb.\tPZO1123\nOther Containers\nItem\tPrice\tWeight\tSource\nAquarium ball\t80 gp\t20 lbs.\tPPC:FF\nRockshard canister\t50 gp\t25 lbs.\tMTT\n1 These items weigh one-quarter this amount when made for Small characters. Containers for Small characters also carry one-quarter the normal amount.\n2 These items weigh approximately three-quarters this amount when made for Small characters. Containers for Small characters also carry one-quarter the normal amount.\n\nAquarium Ball\nSource PPC:FF\n\nPrice 80 gp; Weight 20 lbs.\n\nThis clear, 1-inch-thick glass orb is the size of a large melon and hangs from a thick chain. It can hold up to 2 gallons of freshwater or saltwater, allowing it to house aquatic creatures such as fish or frogs. The cap near the top of the ball can be unscrewed for access. One Tiny creature or two Diminutive creatures can fit comfortably into an aquarium\
      \ ball. The water within the orb must be changed daily in order to keep the creatures within alive. Otherwise, the inhabitants begin to slowly suffocate.\n\nBackpack\nType\tPrice\tWeight\nCommon\t2 gp\t2 lbs.\nMasterwork\t50 gp\t4 lbs.\nCarrier\t25 gp\t5 lbs.\nHydration\t40 gp\t4 lbs.\nWeaponrack\t25 gp\t5 lbs.\nBackpack, Common: This leather knapsack has one large pocket that closes with a buckled strap and holds about 2 cubic feet of material. Some may have one or more smaller pockets on the sides.\nBackpack, Masterwork: This backpack has numerous pockets for storing items that might be needed while adventuring. Hooks are included for attaching items such as canteens, pouches, or even a rolled-up blanket. It has padded bands that strap across the chest and the waist to distribute its weight more evenly. Like a common backpack, it can hold about 2 cubic feet of material in its main container. When wearing a masterwork backpack, treat your Strength score as +1 higher than normal when\
      \ calculating your carrying capacity.\nBackpack, Carrier: Reinforced metal bars allow for this leather backpack to withstand a greater degree of stress than a traditional pack. Along with the standard backpack compartment, this pack has an additional pouch and harness at its top. Used together, the harness and pouch can safely contain a Tiny or smaller creature. While harnessed, the creature can’t leave the backpack or see outside of it; it takes a full-round action to remove the harness from a carried creature.\nBackpack, Hydration: This mostly leather backpack has a series of awkward metallic tubes, which run from the pack over your shoulders, and a small bladder at its base. A hydration backpack has a large pocket identical to that of a regular backpack that holds 2 cubic feet of material, while the bladder holds 1 gallon of liquid. The ends of the metal tubes can be positioned to allow you to easily dispense and drink liquid stored in the attached bladder. Consuming water in this\
      \ way grants a +2 circumstance bonus on Constitution checks to avoid nonlethal damage during a forced march.\nBackpack, Weaponrack: This leather backpack includes a small weapons rack. The rack holds up to four weapons, such as battleaxes, longswords, maces, or short swords. Allies adjacent to you can retrieve a weapon from the rack as a move action without provoking attacks of opportunity, as if they were simply drawing a weapon. Like a normal backpack, it can hold 2 cubic feet of material in its main compartment.\nBag, Waterproof\nPrice 5 sp; Weight 1/2 lb.\n\nThis leather sack sealed with tar or pitch keeps delicate items from being ruined by water. Items kept inside remain relatively dry, making the bag ideal for carrying maps, scrolls, spellbooks, and the like, although the bag is not impervious and can only be completely immersed for 10 rounds before enough water seeps in to ruin such items.\n\nBandolier\nPrice 5 sp; Weight —\n\nThis leather belt is worn over one shoulder and\
      \ runs diagonally across the chest and back. It has small loops or pouches for holding eight objects the size of a flask or small dagger. You can use the “retrieve a stored item” action to take an item from a bandolier. You can wear up to two bandoliers at the same time (any more than this and they get in each other’s way and restrict your movement)."
